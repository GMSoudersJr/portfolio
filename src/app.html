<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Gerald Souders — Technical Product Manager with a full-stack developer background. Based in Singapore, open to remote TPM and PM roles." />
		<meta property="og:site_name" content="Gerald Souders" />
		<meta property="og:title" content="Gerald Souders — Technical Product Manager" />
		<meta property="og:type" content="website" />
		<meta property="og:description" content="Technical Product Manager with a full-stack developer background. Based in Singapore, open to remote TPM and PM roles." />
		<meta property="og:url" content="https://geraldsouders.com/" />
		<meta property="og:image" content="https://geraldsouders.com/og-image.png" />
		<meta property="og:image:width" content="1200" />

		<meta property="og:image:alt" content="Gerald Souders — TPM Who Can Ship Code" />
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:title" content="Gerald Souders — Technical Product Manager" />
		<meta property="twitter:description" content="Technical Product Manager with a full-stack developer background. Based in Singapore, open to remote TPM and PM roles." />
		<meta property="twitter:image" content="https://geraldsouders.com/og-image.png" />
		<link rel="canonical" href="https://geraldsouders.com/" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
		<script>
			// Set theme before first paint to avoid flash
			const stored = localStorage.getItem('theme');
			const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			document.documentElement.setAttribute('data-theme', stored ?? preferred);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
